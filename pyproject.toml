[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localhistory"
version = "0.1.0"
description = "Search and explore historical places, people, and events from Wikipedia and Wikidata."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "requests",
]

[project.optional-dependencies]
api = [
    "fastapi==0.115.12",
    "gunicorn",
    "uvicorn[standard]==0.34.2",
]
semantic = [
    "sentence-transformers",
    "transformers==4.45.2",
    "torch",
]
preprocessing = [
    "geonamescache==3.0.2",
    "pyarrow",
    "pyspark",
    "mwxml",
    "mwparserfromhell",
    "sentence-transformers",
    "transformers==4.45.2",
    "torch",
]
data = [
    "pyspark",
]
dev = [
    "jupyter",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
